# Windows build. Run `npm run dist` (needs Windows for the exe icon) or `npm run dist:mac` to cross-build from a Mac.
appId: app.dynamicislandmusic.windows
productName: Dynamic Island Music
copyright: GPL-3.0. Basada en Boring Notch (TheBoredTeam)
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - assets/**/*
  - package.json
  - "!**/*.map"
asar: true
# The PowerShell helpers must live outside the asar so powershell.exe can read them.
extraResources:
  - from: src/main/ps
    to: ps
  - from: ../LICENSE
    to: LICENSE.txt
  - from: ../NOTICE.md
    to: NOTICE.md
artifactName: DynamicIslandMusic-Windows-x64.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.png
  requestedExecutionLevel: asInvoker # never asks for administrator
nsis:
  oneClick: true # one click, no wizard
  perMachine: false # installs only for this user (in %LOCALAPPDATA%), so no administrator prompt
  allowElevation: false
  createStartMenuShortcut: true
  createDesktopShortcut: false
  shortcutName: Dynamic Island Music
  uninstallDisplayName: Dynamic Island Music
  runAfterFinish: true
  deleteAppDataOnUninstall: false # the person's notes and settings stay if they uninstall
  artifactName: DynamicIslandMusic-Setup.${ext}
publish: null
