name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: App para Mac
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          xcodebuild -project DynamicIslandMusic.xcodeproj -scheme boringNotch -configuration Release \
            -derivedDataPath build -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" ENABLE_HARDENED_RUNTIME=NO DEVELOPMENT_TEAM="" CODE_SIGN_STYLE=Manual \
            -skipMacroValidation -skipPackagePluginValidation build
      - name: Crear el .dmg
        run: scripts/make-dmg.sh
      - name: Subir a la versión
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" dist/DynamicIslandMusic.dmg dist/DynamicIslandMusic.dmg.sha256 --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandMusic-mac
          path: dist/
