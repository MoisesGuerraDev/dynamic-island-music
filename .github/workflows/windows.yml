name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: App para Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - name: Pruebas
        run: npm test
      - name: Poner la versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Crear el instalador y el .zip
        run: npm run dist
      - name: Sumas de verificación
        shell: pwsh
        run: |
          foreach ($f in 'DynamicIslandMusic-Setup.exe', 'DynamicIslandMusic-Windows-x64.zip') {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $f" | Out-File -Encoding ascii "dist/$f.sha256"
          }
      - name: Subir a la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            dist/DynamicIslandMusic-Setup.exe dist/DynamicIslandMusic-Setup.exe.sha256 \
            dist/DynamicIslandMusic-Windows-x64.zip dist/DynamicIslandMusic-Windows-x64.zip.sha256 --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandMusic-windows
          path: |
            windows/dist/DynamicIslandMusic-Setup.exe
            windows/dist/DynamicIslandMusic-Windows-x64.zip
