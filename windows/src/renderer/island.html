<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data: file:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dynamic Island Music</title>
<link rel="stylesheet" href="island.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="lgdist" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.5" result="b"/><feTurbulence type="fractalNoise" baseFrequency=".03 .05" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="b" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/><feColorMatrix type="saturate" values="1.7"/></filter></svg>
<svg id="lqdefs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div id="stage">
  <div id="pill" class="pill-closed" aria-label="Isla cerrada"></div>
  <div id="third" class="gcard below" hidden></div>
  <div id="toast" class="gcard" hidden></div>
  <div id="silent" class="gcard silent" hidden></div>
  <div class="halo" style="--k:0"></div><div class="halo" style="--k:1"></div><div class="halo" style="--k:2"></div>
  <div id="notch" class="notch g-glass" role="region" aria-label="Isla">
    <div class="amb"><div class="ll" style="--k:0"><i class="lb"></i><i class="rb r0"></i><i class="rb r1"></i><i class="rb r2"></i><i class="rb r3"></i><i class="rb r4"></i></div><div class="ll" style="--k:1"><i class="lb"></i><i class="rb r0"></i><i class="rb r1"></i><i class="rb r2"></i><i class="rb r3"></i><i class="rb r4"></i></div><div class="ll" style="--k:2"><i class="lb"></i><i class="rb r0"></i><i class="rb r1"></i><i class="rb r2"></i><i class="rb r3"></i><i class="rb r4"></i></div><i class="mlight"></i></div>
    <div class="rim"></div>
    <div class="ntabs">
      <div id="ntabs-l"></div>
      <div id="ntabs-m"></div>
      <div id="ntabs-r"></div>
    </div>
    <div class="row" id="row"></div>
    <div class="webdock" id="webdock" hidden><div class="chat-h" id="webbar"></div><div id="webviews"></div><div class="chat-f">Inicia sesión con tu cuenta (también con Google). La sesión se guarda solo en este PC.</div></div>
    <div class="editbar" id="editbar" hidden></div>
    <div class="lp-panel" id="lightpanel" hidden></div>
  </div>
</div>

<script type="module" src="island.js"></script>
</body>
</html>
